services:

  backend:
    build:
      context: ./src/DevOpsDemoApi
      dockerfile: Dockerfile

    container_name: dotnet-api

    restart: unless-stopped

    expose:
      - "8080"

    networks:
      - devops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: react-frontend

    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - backend

    networks:
      - devops-network

  nginx:
    image: nginx:stable-alpine

    container_name: nginx-reverse-proxy

    restart: unless-stopped

    ports:
      - "9000:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend
      - frontend

    networks:
      - devops-network

networks:
  devops-network: